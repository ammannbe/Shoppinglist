# `ddev pull production`: database and product images from the production server (like RecipeManager).
# Provided via .ddev/config.local.yaml (git-ignored):
# web_environment:
#   - SSH_USER=
#   - SSH_HOST=
#   - PROJECT_PATH=

auth_command:
  command: |
    set -eu -o pipefail
    ssh-add -l >/dev/null || ( echo "Please 'ddev auth ssh' before running this command." && exit 1 )

db_pull_command:
  command: |
    set -eu -o pipefail
    ssh "${SSH_USER}@${SSH_HOST}" "cd '${PROJECT_PATH}' && bash -s" <<'REMOTE'
    set -eu -o pipefail
    set -a; source .env; set +a
    mkdir -p storage/backups
    mysqldump --single-transaction --quick --no-tablespaces \
      -h "${DB_HOST:-127.0.0.1}" -P "${DB_PORT:-3306}" \
      -u "${DB_USERNAME}" -p"${DB_PASSWORD}" "${DB_DATABASE}" \
      | gzip > storage/backups/db.sql.gz
    REMOTE
    scp "${SSH_USER}@${SSH_HOST}:${PROJECT_PATH}/storage/backups/db.sql.gz" /var/www/html/.ddev/.downloads/db.sql.gz
    # The dump contains personal data, don't leave it on the server.
    ssh "${SSH_USER}@${SSH_HOST}" "rm -f '${PROJECT_PATH}/storage/backups/db.sql.gz'"
  service: web

# Files: only the product images (storage/app/private/images). Never touch the rest of storage/app.
files_pull_command:
  command: |
    set -eu -o pipefail
    mkdir -p /var/www/html/.ddev/.downloads/files
    # Nothing to pull before the first image was uploaded.
    if ssh "${SSH_USER}@${SSH_HOST}" "test -d '${PROJECT_PATH}/storage/app/private/images'"; then
      rsync -az --delete "${SSH_USER}@${SSH_HOST}:${PROJECT_PATH}/storage/app/private/images/" /var/www/html/.ddev/.downloads/files/
    fi
  service: web

# The images belong to the pulled database: mirror them exactly (local-only images are dropped).
files_import_command:
  command: |
    set -eu -o pipefail
    mkdir -p /var/www/html/storage/app/private/images
    rsync -a --delete /var/www/html/.ddev/.downloads/files/ /var/www/html/storage/app/private/images/
  service: web

db_push_command:
  command: |
    echo "ddev push is not implemented."

files_push_command:
  command: |
    echo "ddev push is not implemented."
